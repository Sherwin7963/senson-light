<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | OWELL Industrial</title>
    <script>
      // GitHub Pages SPA fallback for BrowserRouter (History API)
      // 原理：把 404 时的完整路径存入 sessionStorage，然后重定向到站点根 index.html
      // React 应用启动后从 sessionStorage 读取路径并通过 history.replaceState 恢复
      // 这样 URL 保持干净（没有 #），BrowserRouter 能正确识别路由
      //
      // 修复 v133：
      // - 深层路径（如 /admin/dashboard）下，相对路径 './' 会解析到父目录 /admin/
      //   而不是站点根，导致二次 404、sessionStorage 被覆盖、路径丢失、反复跳转
      // - 改为：根据当前路径深度动态计算返回站点根所需的 ../ 层数
      //   /products → 0 层 ../ → ./
      //   /admin/dashboard → 1 层 ../ → ../
      //   /repo-name/admin/dashboard → 2 层 ../ → ../../
      // - 根域名部署和子路径部署（GitHub Pages 项目页）都能正确回到 index.html
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem('spa-redirect', path);
        } catch (e) {
          // sessionStorage 不可用时降级为 hash 方式
          window.location.replace('./#' + path);
          return;
        }

        // 根据路径深度计算返回站点根的相对路径
        // 浏览器解析相对路径时，以「最后一个 / 之前的部分」为基准目录
        //   /products → 基准目录 / → 深度 0 → ./
        //   /admin/dashboard → 基准目录 /admin/ → 深度 1 → ../
        //   /admin/ → 基准目录 /admin/ → 深度 1 → ../
        //   /repo/admin/dashboard → 基准目录 /repo/admin/ → 深度 2 → ../../
        var pathname = window.location.pathname;
        var lastSlashIdx = pathname.lastIndexOf('/');
        var baseDir = pathname.substring(0, lastSlashIdx + 1);
        var depth = baseDir.split('/').filter(Boolean).length;

        var rootPath;
        if (depth === 0) {
          rootPath = './';
        } else {
          rootPath = '';
          for (var i = 0; i < depth; i++) {
            rootPath += '../';
          }
        }

        window.location.replace(rootPath);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
