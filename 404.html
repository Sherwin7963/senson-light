<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | OWELL Industrial</title>
    <script>
      // GitHub Pages SPA fallback for BrowserRouter (History API)
      // 原理：把 404 时的完整路径存入 sessionStorage，然后重定向到站点根 index.html
      // React 应用启动后从 sessionStorage 读取路径并通过 history.replaceState 恢复
      // 这样 URL 保持干净（没有 #），BrowserRouter 能正确识别路由
      //
      // 修复 v48：之前使用 slice(0,-1) 计算上一级目录并重定向，
      // 在根域名部署下访问 /admin/dashboard 等多级路径时，会重定向到
      // /admin/（仍是 404），形成无限重定向循环，页面一直闪烁。
      // 改为直接重定向到站点根 /，无论深度多少都能命中 index.html。
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem('spa-redirect', path);
        } catch (e) {
          // sessionStorage 不可用时降级为 hash 方式
          window.location.replace('/#' + path);
          return;
        }
        // 直接重定向到站点根（根域名 / GitHub Pages 仓库根都命中 index.html）
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
