        </div>
      </div>
    </div>
    <script>
      (function() {
        var hasError = false;
        function showError(msg) {
          if (hasError) return;
          hasError = true;
          var root = document.getElementById("root");
          if (root) root.innerHTML = "";
          var fb = document.getElementById("app-error-fallback");
          if (fb) {
            fb.style.display = "flex";
            var detail = document.getElementById("app-error-detail");
            if (detail) detail.textContent = msg || "Unknown error";
          }
          document.body.style.background = "#ffffff";
          document.body.style.backgroundColor = "#ffffff";
        }
        window.addEventListener("error", function(e) {
          var msg = e.message || (e.error && e.error.message) || String(e);
          if (msg.indexOf("ResizeObserver") >= 0) return;
          showError(msg);
        }, true);
        window.addEventListener("unhandledrejection", function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || String(reason))) || String(e);
          showError("Unhandled Promise rejection: " + msg);
        });
        setTimeout(function() {
          var root = document.getElementById("root");
          if (root && root.children.length === 0 && root.innerHTML.trim() === "") {
            showError("App failed to mount within 5 seconds. Check browser console for details.");
          }
        }, 5000);
      })();
    </script>
