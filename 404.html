<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | OWELL Industrial</title>
    <script>
      // GitHub Pages SPA fallback for BrowserRouter (History API)
      // 原理：把 404 时的完整路径存入 sessionStorage，然后重定向到站点根 index.html
      // React 应用启动后从 sessionStorage 读取路径并通过 history.replaceState 恢复
      // 这样 URL 保持干净（没有 #），BrowserRouter 能正确识别路由
      //
      // 修复 v52：
      // - 根域名部署（如 example.com/products）和子路径部署
      //   （如 example.com/repo-name/products）都能正确回到 index.html
      // - 使用相对路径 './'，重定向到当前 404.html 所在目录（即站点根）
      // - 在子路径部署下，404.html 始终在仓库根目录，所以 './' 就是仓库根
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem('spa-redirect', path);
        } catch (e) {
          // sessionStorage 不可用时降级为 hash 方式
          window.location.replace('./#' + path);
          return;
        }
        // 相对路径：回到 404.html 所在目录（即站点/仓库根），命中 index.html
        // 根域名部署 → './' = '/'
        // 子路径部署 → './' = '/repo-name/'
        window.location.replace('./');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
