name: Inquiry Email Notification

on:
  issues:
    types: [opened, labeled]

jobs:
  send-inquiry-email:
    name: Send Inquiry Email
    runs-on: ubuntu-latest
    # 触发条件：
    # - opened 事件：标题以 [Inquiry] 开头（主路径）
    # - labeled 事件：标签是 inquiry 且标题不以 [Inquiry] 开头（兜底，避免重复发信）
    if: |
      (github.event.action == 'opened' && startsWith(github.event.issue.title, '[Inquiry]')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'inquiry' && !startsWith(github.event.issue.title, '[Inquiry]'))
    steps:
      - name: Debug - issue and event info
        id: debug
        run: |
          echo "=== Issue Details ==="
          echo "Event action: ${{ github.event.action }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue URL: ${{ github.event.issue.html_url }}"
          echo "Issue state: ${{ github.event.issue.state }}"
          echo "Created at: ${{ github.event.issue.created_at }}"
          echo "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"
          if [ "${{ github.event.action }}" = "labeled" ]; then
            echo "Label that triggered: ${{ github.event.label.name }}"
          fi
          echo ""
          echo "=== Secrets availability (check only, values are masked) ==="
          if [ -n "${{ secrets.SMTP_SERVER }}" ]; then echo "  SMTP_SERVER: SET"; else echo "  SMTP_SERVER: MISSING"; fi
          if [ -n "${{ secrets.SMTP_PORT }}" ]; then echo "  SMTP_PORT: SET"; else echo "  SMTP_PORT: MISSING"; fi
          if [ -n "${{ secrets.SMTP_USERNAME }}" ]; then echo "  SMTP_USERNAME: SET"; else echo "  SMTP_USERNAME: MISSING"; fi
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then echo "  SMTP_PASSWORD: SET"; else echo "  SMTP_PASSWORD: MISSING"; fi
          if [ -n "${{ secrets.NOTIFY_EMAIL }}" ]; then echo "  NOTIFY_EMAIL: SET"; else echo "  NOTIFY_EMAIL: MISSING"; fi
          if [ -n "${{ secrets.SENDER_EMAIL }}" ]; then echo "  SENDER_EMAIL: SET"; else echo "  SENDER_EMAIL: MISSING"; fi
          echo ""
          echo "=== Trigger info ==="
          echo "  action=opened, title starts with [Inquiry]: ${{ github.event.action == 'opened' && startsWith(github.event.issue.title, '[Inquiry]') }}"
          echo "  action=labeled, label=inquiry, no title match: ${{ github.event.action == 'labeled' && github.event.label.name == 'inquiry' && !startsWith(github.event.issue.title, '[Inquiry]') }}"

      - name: Validate required secrets
        id: validate
        run: |
          MISSING=""
          if [ -z "${{ secrets.SMTP_SERVER }}" ]; then MISSING="$MISSING SMTP_SERVER"; fi
          if [ -z "${{ secrets.SMTP_PORT }}" ]; then MISSING="$MISSING SMTP_PORT"; fi
          if [ -z "${{ secrets.SMTP_USERNAME }}" ]; then MISSING="$MISSING SMTP_USERNAME"; fi
          if [ -z "${{ secrets.SMTP_PASSWORD }}" ]; then MISSING="$MISSING SMTP_PASSWORD"; fi
          if [ -z "${{ secrets.NOTIFY_EMAIL }}" ]; then MISSING="$MISSING NOTIFY_EMAIL"; fi
          if [ -z "${{ secrets.SENDER_EMAIL }}" ]; then MISSING="$MISSING SENDER_EMAIL"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "::error::Please configure these secrets in Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: Send inquiry email
        id: send-email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Inquiry] ${{ github.event.issue.title }}"
          from: ${{ secrets.SENDER_EMAIL }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            New Inquiry Received!

            ========================================
            Issue Title: ${{ github.event.issue.title }}
            Issue Number: #${{ github.event.issue.number }}
            Issue URL: ${{ github.event.issue.html_url }}
            Created By: ${{ github.event.issue.user.login }}
            Created At: ${{ github.event.issue.created_at }}
            Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}
            ========================================

            Inquiry Content:
            ----------------------------------------
            ${{ github.event.issue.body }}
            ----------------------------------------

            Please login to GitHub to view and respond to this inquiry:
            ${{ github.event.issue.html_url }}

            --
            This email was sent automatically by GitHub Actions.
            Repository: ${{ github.repository }}

      - name: Success notification
        if: success()
        run: |
          echo "✅ Inquiry email sent successfully!"
          echo "Issue: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          echo "Sent to: ${{ secrets.NOTIFY_EMAIL }}"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Failed to send inquiry email!"
          echo "Please check the logs above for error details."
          echo "Common issues:"
          echo "  - SMTP_PASSWORD should be the 3rd-party client password (16 chars), NOT the login password"
          echo "  - SMTP_SERVER should be smtp.qiye.aliyun.com for Alibaba Cloud Enterprise Email"
          echo "  - SMTP_PORT should be 465 (SSL) or 587 (TLS)"
          echo "  - All 6 secrets must be configured: SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, NOTIFY_EMAIL, SENDER_EMAIL"
          exit 1
