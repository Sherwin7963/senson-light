          // 页面完全加载后如果正常，清除刷新标记
          window.addEventListener('load', function() {
            setTimeout(function() {
              if (!isBlankScreen()) {
                sessionStorage.removeItem('ws_auto_reloaded');
              }
            }, 2000);
          });
        })();
      })();</script><script>
(function() {
  var errors = [];
  var maxErrors = 30;
  var mountTimer = null;
  var hasMounted = false;
  var startTime = Date.now();
  var VERSION = "V113";

  function formatError(type, msg, url, line, col, stack) {
    var ts = new Date().toISOString();
    var parts = ["[" + ts + "] [" + type + "]"];
    if (msg) parts.push(msg);
    if (url) parts.push("URL: " + url);
    if (line != null) parts.push("Line: " + line + (col != null ? ":" + col : ""));
    if (stack) parts.push("Stack: " + stack);
    return parts.join("\n");
  }

  function addError(type, msg, url, line, col, stack) {
    if (errors.length >= maxErrors) errors.shift();
    errors.push(formatError(type, msg, url, line, col, stack));
    showError();
  }

  window.addEventListener("error", function(e) {
    if (e.target && (e.target.tagName === "IMG" || e.target.tagName === "SOURCE")) {
      // V122：图片加载失败只记录日志，不触发错误覆盖层
      // 图片 404 是常见情况，不应让整个页面崩溃
      var src = e.target.src || "unknown";
      console.warn("[ResourceLoadError] Failed to load image:", src);
      return;
    }
    e.preventDefault();
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var tagName = e.target.tagName;
      var src = e.target.src || e.target.href || "unknown";
      addError("ResourceLoadError", "Failed to load " + tagName + ": " + src, src, null, null, null);
      return;
    }
    var msg = e.message ? String(e.message) : (e.error && e.error.message ? e.error.message : "Unknown error");
    var stack = e.error && e.error.stack ? String(e.error.stack) : null;
    addError("RuntimeError", msg, e.filename, e.lineno, e.colno, stack);
  }, true);

  window.addEventListener("unhandledrejection", function(e) {
    e.preventDefault();
    var reason = e.reason;
    var msg = "Unhandled Promise Rejection";
    var stack = null;
    if (reason) {
      if (typeof reason === "string") msg = reason;
      else if (reason.message) { msg = String(reason.message); stack = reason.stack ? String(reason.stack) : null; }
      else { try { msg = JSON.stringify(reason); } catch(_) { msg = String(reason); } }
    }
    addError("PromiseRejection", msg, null, null, null, stack);
  });

  function checkMount() {
    if (hasMounted) return;
    var root = document.getElementById("root");
    if (root && root.children.length > 0) { hasMounted = true; if (mountTimer) clearInterval(mountTimer); return; }
    var elapsed = Date.now() - startTime;
    if (elapsed > 10000 && !hasMounted) {
      addError("MountTimeout", "App failed to mount within 10 seconds.",
        null, null, null,
        "Elapsed: " + elapsed + "ms\nErrors captured: " + errors.length + "\nRoot element: " + (root ? "found" : "not found"));
    }
  }
  mountTimer = setInterval(checkMount, 500);

  if (typeof MutationObserver !== "undefined") {
    var observer = new MutationObserver(function() {
      var root = document.getElementById("root");
      if (root && root.children.length > 0) {
        hasMounted = true;
        if (mountTimer) { clearInterval(mountTimer); mountTimer = null; }
        var overlay = document.getElementById("error-overlay");
        var realErrors = errors.filter(function(e) { return e.indexOf("[MountTimeout]") === -1; });
        if (overlay && realErrors.length === 0) overlay.style.display = "none";
        observer.disconnect();
      }
    });
    if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    else document.addEventListener("DOMContentLoaded", function() { observer.observe(document.body, { childList: true, subtree: true }); });
  }

  function showError() {
    var old = document.getElementById("error-overlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.id = "error-overlay";
    var latestError = errors[errors.length - 1] || "";
    var moreErrors = errors.length > 1
      ? "\n\n--- Additional errors (" + (errors.length - 1) + " more) ---\n" + errors.slice(0, -1).join("\n\n")
      : "";
    overlay.innerHTML =
      '<div id="error-card">' +
        '<div id="error-title"><div id="error-icon">!</div><span>Page Load Error</span></div>' +
        '<p id="error-subtitle">Something went wrong. Details below.</p>' +
        '<div id="error-details-wrapper">' +
          '<div id="error-details">' + escapeHtml(latestError) + '</div>' +
          '<div id="error-more-info">' + escapeHtml(moreErrors) + '</div>' +
        '</div>' +
        '<div id="error-actions">' +
          '<button id="error-refresh">Refresh Page</button>' +
          '<button id="error-toggle">Toggle Details</button>' +
          '<button id="error-copy">Copy Error</button>' +
        '</div>' +
        '<div id="error-footer">' + VERSION + ' Error Handler | Static Deploy</div>' +
      '</div>';
    if (document.body) document.body.appendChild(overlay);
    else document.addEventListener("DOMContentLoaded", function() { document.body.appendChild(overlay); });

    document.getElementById("error-refresh").addEventListener("click", function() { location.reload(); });
    document.getElementById("error-toggle").addEventListener("click", function() {
      document.getElementById("error-more-info").classList.toggle("visible");
    });
    document.getElementById("error-copy").addEventListener("click", function() {
      var text = errors.join("\n\n");
      var btn = document.getElementById("error-copy");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() { btn.textContent = "Copied!"; setTimeout(function() { btn.textContent = "Copy Error"; }, 2000); }).catch(function() { fallbackCopy(text); });
      } else fallbackCopy(text);
      function fallbackCopy(t) {
        var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); btn.textContent = "Copied!"; } catch(e) { btn.textContent = "Copy failed"; }
        document.body.removeChild(ta); setTimeout(function() { btn.textContent = "Copy Error"; }, 2000);
      }
    });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
})();
</script>
</body></html>
