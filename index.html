    <script>
    (function() {
      var hasError = false;
      var errorLog = [];

      function addError(type, detail) {
        var ts = new Date().toISOString();
        var entry = "[" + ts + "] [" + type + "]\n" + detail;
        errorLog.push(entry);
        if (errorLog.length > 30) errorLog.shift();
      }

      function formatError(err) {
        if (!err) return "(no error object)";
        if (typeof err === "string") return err;
        var parts = [];
        try {
          if (err.name) parts.push("Name: " + err.name);
          if (err.message) parts.push("Message: " + err.message);
          if (err.filename) parts.push("File: " + err.filename);
          else if (err.fileName) parts.push("File: " + err.fileName);
          if (err.lineno !== undefined) parts.push("Line: " + err.lineno);
          else if (err.lineNumber !== undefined) parts.push("Line: " + err.lineNumber);
          if (err.colno !== undefined) parts.push("Column: " + err.colno);
          else if (err.columnNumber !== undefined) parts.push("Column: " + err.columnNumber);
          if (err.stack) parts.push("Stack:\n" + err.stack);
          if (parts.length === 0) {
            try { return JSON.stringify(err); } catch(e) { return String(err); }
          }
        } catch(e) {
          return String(err);
        }
        return parts.join("\n");
      }

      function showErrorUI() {
        if (hasError) return;
        hasError = true;
        window.__error_has_crashed = true;

        // Clear root to stop any further rendering
        var root = document.getElementById("root");
        if (root) { root.innerHTML = ""; }

        var fb = document.getElementById("app-error-fallback");
        if (fb) {
          fb.style.display = "flex";
          var detail = document.getElementById("app-error-detail");
          if (detail) {
            var text = errorLog.join("\n\n---\n\n");
            detail.textContent = text || "Unknown error occurred (no details available).";
          }
        }

        // Force light background
        document.body.style.background = "#f8fafc";
        document.body.style.backgroundColor = "#f8fafc";
        document.documentElement.style.background = "#f8fafc";
      }

      // ===== 1. window.onerror (most reliable for JS runtime errors) =====
      var originalOnerror = window.onerror;
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        // Ignore harmless ResizeObserver loop errors
        if (typeof msg === "string" && msg.indexOf("ResizeObserver") >= 0) return false;
        if (typeof msg === "string" && msg.indexOf("Script error.") >= 0 && !error) {
          // Cross-origin script error - we can't get details, but don't show full error
          addError("CrossOriginScriptError", "A script from another origin threw an error but details are unavailable (CORS).\nURL: " + url);
          return false;
        }

        var detail = "Message: " + msg + "\nFile: " + url + "\nLine: " + lineNo + ":" + columnNo;
        if (error) {
          detail = formatError(error) + "\n\n--- from onerror ---\n" + detail;
        }
        addError("RuntimeError", detail);
        showErrorUI();

        if (originalOnerror) {
          try { return originalOnerror.apply(this, arguments); } catch(e) {}
        }
        return false;
      };

      // ===== 2. addEventListener error (captures resource load errors) =====
      window.addEventListener("error", function(e) {
        // If it has e.error, it's a JS ErrorEvent - already handled by onerror
        if (e.error) return;

        // Resource load error
        var target = e.target;
        if (!target) return;

        var tag = target.tagName || "UNKNOWN";
        var src = target.src || target.href || target.getAttribute("data-src") || "(unknown source)";

        // Only log, don't show full page error for non-critical resources
        addError("ResourceLoadError", "Failed to load " + tag + ": " + src);

        // Only show fatal error for critical resources
        var isCritical = false;
        if (tag === "SCRIPT") {
          // Check if it's the main entry or a critical chunk
          if (src.indexOf("index-") >= 0 || src.indexOf("dist-") >= 0 || src.indexOf("main") >= 0) {
            isCritical = true;
          } else {
            // Lazy-loaded chunks might be non-critical if not on current page
            isCritical = true; // Be safe - show error for any script failure
          }
        }
        if (tag === "LINK" && target.rel === "stylesheet") {
          // CSS failure is critical
          isCritical = true;
        }

        if (isCritical) {
          showErrorUI();
        }
      }, true);

      // ===== 3. unhandledrejection (promise errors) =====
      window.addEventListener("unhandledrejection", function(e) {
        var reason = e.reason;
        var detail = formatError(reason);
        addError("UnhandledPromiseRejection", detail);
        showErrorUI();
      });

      // ===== 4. Mount timeout checker =====
      function checkMount() {
        if (hasError) return;
        var root = document.getElementById("root");
        if (!root) return;

        var hasContent = false;
        try {
          hasContent = root.children.length > 0 || root.innerHTML.trim().length > 20;
        } catch(e) {}

        if (!hasContent) {
          addError("MountTimeout",
            "Root element is still empty after page load.\n" +
            "React likely crashed during the initial render.\n\n" +
            "Check the errors above for the actual cause.\n" +
            "Common causes:\n" +
            "  - Missing dependency or module\n" +
            "  - Context provider value mismatch\n" +
            "  - Hook called outside component\n" +
            "  - Invalid prop type");
          showErrorUI();
        }
      }

      if (document.readyState === "complete") {
        setTimeout(checkMount, 4000);
      } else {
        window.addEventListener("load", function() {
          setTimeout(checkMount, 4000);
        });
      }
      setTimeout(checkMount, 10000); // Final safety net

      // Expose for debugging
      window.__app_error_log = errorLog;
      window.__app_show_error = showErrorUI;
    })();
    </script>
