    <script>
      // GitHub Pages SPA fallback 路径恢复（与 404.html 配合）
      // 404.html 把原始路径存入 sessionStorage 并重定向到根 index.html
      // 这里在应用启动前恢复路径，让 BrowserRouter 能正确识别
      (function () {
        try {
          var redirect = sessionStorage.getItem('spa-redirect');
          if (redirect && redirect !== '/') {
            sessionStorage.removeItem('spa-redirect');
            // 用 replaceState 替换当前历史记录，URL 变了但不触发刷新
            window.history.replaceState(null, '', redirect);
          }
        } catch (e) {
          // sessionStorage 不可用时忽略
        }
      })();

      // GitHub Pages 环境：basename 为根路径 /
      // index.tsx 会读 window.__BASENAME__ 作为路由 basename
      window.__BASENAME__ = '/';
    </script>
