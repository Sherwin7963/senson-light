      // ====== 资源加载失败自动重试（JS/CSS 404 时自动追加新 script/link） ======
      (function() {
        var retryCount = {};
        var MAX_RETRIES = 2;
        var RETRY_DELAY = 800;

        function getAssetPath(src) {
          try {
            var url = new URL(src, window.location.href);
            return url.pathname;
          } catch (e) {
            return src;
          }
        }

        function retryScript(src) {
          var path = getAssetPath(src);
          var key = path;
          retryCount[key] = (retryCount[key] || 0) + 1;
          if (retryCount[key] > MAX_RETRIES) return;

          // 用时间戳参数绕过缓存重试
          setTimeout(function() {
            var s = document.createElement('script');
            s.type = 'module';
            s.src = path + (path.indexOf('?') === -1 ? '?' : '&') + 'retry=' + retryCount[key];
            s.onerror = function() { retryScript(src); };
            document.head.appendChild(s);
          }, RETRY_DELAY * retryCount[key]);
        }

        function retryStylesheet(href) {
          var path = getAssetPath(href);
          var key = path;
          retryCount[key] = (retryCount[key] || 0) + 1;
          if (retryCount[key] > MAX_RETRIES) return;

          setTimeout(function() {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = path + (path.indexOf('?') === -1 ? '?' : '&') + 'retry=' + retryCount[key];
            link.onerror = function() { retryStylesheet(href); };
            document.head.appendChild(link);
          }, RETRY_DELAY * retryCount[key]);
        }

        // 捕获资源加载错误
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (!target) return;
          // script 加载失败
          if (target.tagName === 'SCRIPT' && target.src) {
            e.preventDefault();
            retryScript(target.src);
          }
          // link[rel=stylesheet] 加载失败
          if (target.tagName === 'LINK' && target.rel === 'stylesheet' && target.href) {
            e.preventDefault();
            retryStylesheet(target.href);
          }
        }, true);

        // ====== 白屏 watchdog：检测页面是否长时间空白，自动刷新恢复 ======
        (function() {
          var checkCount = 0;
          var MAX_CHECKS = 15; // 15 * 1s = 15s
          var AUTO_RELOAD_AFTER = 10; // 10 次检查后自动刷新

          function isBlankScreen() {
            var root = document.getElementById('root');
            if (!root) return true;
            // root 为空 → 空白
            if (root.children.length === 0) return true;
            // root 内容高度极小 → 可能白屏
            if (root.offsetHeight < 50 && root.children.length < 2) return true;
            return false;

            if (!isBlankScreen()) {

              return;
            }

            // 超过自动刷新阈值，尝试刷新
            if (checkCount >= AUTO_RELOAD_AFTER) {
              clearInterval(watchdogTimer);
              // 只自动刷新一次，避免无限循环
              if (!sessionStorage.getItem('ws_auto_reloaded')) {
                sessionStorage.setItem('ws_auto_reloaded', '1');
                window.location.reload(true);
              } else {

                showManualRecovery();
              }
              return;
            }

            // 接近阈值时显示提示
            if (checkCount >= MAX_CHECKS - 3) {

            }
          }, 1000);

          function showLoadingHint(count) {
            var existing = document.getElementById('ws-loading-hint');
            if (existing) {

            div.textContent = 'Loading is taking longer than expected... (' + (MAX_CHECKS - count) + 's until auto-recovery)';
            document.body.appendChild(div);
          }

          function showManualRecovery() {
            var hint = document.getElementById('ws-loading-hint');
            if (hint) hint.remove();

            var div = document.createElement('div');
            div.className = 'ws-watchdog-alert';
            div.innerHTML = '<div style="font-weight:600;color:#e63946;margin-bottom:6px;">Page failed to load</div>' +

              }
            }, 2000);
          });
        })();

  <script>
(function() {
  var errors = [];
  var maxErrors = 30;
  var mountTimer = null;
  var hasMounted = false;
  var startTime = Date.now();
  var VERSION = "V113";

  function formatError(type, msg, url, line, col, stack) {
    var ts = new Date().toISOString();
    var parts = ["[" + ts + "] [" + type + "]"];
    if (msg) parts.push(msg);
    if (url) parts.push("URL: " + url);
    if (line != null) parts.push("Line: " + line + (col != null ? ":" + col : ""));
    if (stack) parts.push("Stack: " + stack);
    return parts.join("\n");
  }

  function addError(type, msg, url, line, col, stack) {
    if (errors.length >= maxErrors) errors.shift();
    errors.push(formatError(type, msg, url, line, col, stack));
    showError();

    if (e.target && (e.target.tagName === "IMG" || e.target.tagName === "SOURCE")) {

      // 图片 404 是常见情况，不应让整个页面崩溃
      var src = e.target.src || "unknown";
      console.warn("[ResourceLoadError] Failed to load image:", src);
      return;
    }
    e.preventDefault();
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var tagName = e.target.tagName;
      var src = e.target.src || e.target.href || "unknown";
      addError("ResourceLoadError", "Failed to load " + tagName + ": " + src, src, null, null, null);
      return;

    var stack = e.error && e.error.stack ? String(e.error.stack) : null;
    addError("RuntimeError", msg, e.filename, e.lineno, e.colno, stack);

    e.preventDefault();

  }

  function showError() {
    var old = document.getElementById("error-overlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.id = "error-overlay";
    var latestError = errors[errors.length - 1] || "";
    var moreErrors = errors.length > 1
      ? "\n\n--- Additional errors (" + (errors.length - 1) + " more) ---\n" + errors.slice(0, -1).join("\n\n")
      : "";
    overlay.innerHTML =
      '<div id="error-card">' +
        '<div id="error-title"><div id="error-icon">!</div><span>Page Load Error</span></div>' +
        '<p id="error-subtitle">Something went wrong. Details below.</p>' +
        '<div id="error-details-wrapper">' +

          '<div id="error-more-info">' + escapeHtml(moreErrors) + '</div>' +
        '</div>' +
        '<div id="error-actions">' +
          '<button id="error-refresh">Refresh Page</button>' +
          '<button id="error-toggle">Toggle Details</button>' +
          '<button id="error-copy">Copy Error</button>' +
        '</div>' +
        '<div id="error-footer">' + VERSION + ' Error Handler | Static Deploy</div>' +

    else document.addEventListener("DOMContentLoaded", function() { document.body.appendChild(overlay); });

    document.getElementById("error-toggle").addEventListener("click", function() {

    var div = document.createElement("div");
