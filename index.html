  <script>
    // GitHub Pages 部署：app 信息与 basename 从实际路径推断
    window.appId = '';

    window.ENVIRONMENT = 'production';
    // 从 pathname 推断 basename（去掉最后一段文件名后所有目录段，到仓库名为止）
    (function () {
      var p = window.location.pathname;
      // 去掉末尾文件名或斜杠
      if (p.endsWith('/index.html')) p = p.slice(0, -11);
      var segs = p.split('/').filter(Boolean);
      // GitHub Pages: /<repo>/  或 子路径
      if (segs.length >= 1 && segs[0] !== 'app') {
        window.__BASENAME__ = '/' + segs[0];
      } else {
        window.__BASENAME__ = '';
      }
    })();

      description: 'LED Sensor Light Manufacturer',
    };
  </script>
  <script>
    // SPA fallback：404.html 写入 sessionStorage 的路径恢复
    (function () {
      try {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          // 替换当前历史记录，保持 URL 干净
          var base = window.__BASENAME__ || '';
          var target = base + redirect;
          window.history.replaceState(null, '', target);
        }
